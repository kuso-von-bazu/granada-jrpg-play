<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>グラナダ開拓記 ストーリーボード</title>
<style>
  :root {
    --bg: #16151c;
    --panel: #201f2a;
    --panel2: #2a2938;
    --line: #3d3b52;
    --ink: #e8e4d8;
    --dim: #9a96a8;
    --gold: #d8b653;
    --blue: #6ea8dc;
    --green: #7ec87e;
    --purple: #b48ad6;
    --red: #d67a7a;
    --lock: #55525f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Yu Gothic UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-size: 14px; display: flex; flex-direction: column;
  }
  header {
    padding: 10px 16px; border-bottom: 2px solid var(--gold);
    background: linear-gradient(#26243a, #1b1a26);
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
  }
  header h1 { margin: 0; font-size: 18px; color: var(--gold); letter-spacing: 2px; }
  header .sub { color: var(--dim); font-size: 12px; }
  #wrap { flex: 1; display: flex; min-height: 0; }
  #graph-pane { flex: 1; overflow: auto; position: relative; }
  #graph-pane svg { display: block; }
  #side {
    width: 380px; min-width: 300px; border-left: 1px solid var(--line);
    background: var(--panel); display: flex; flex-direction: column; min-height: 0;
  }
  #tabs { display: flex; border-bottom: 1px solid var(--line); }
  #tabs button {
    flex: 1; padding: 9px 4px; background: none; border: none; color: var(--dim);
    font-size: 13px; cursor: pointer; border-bottom: 2px solid transparent; font-family: inherit;
  }
  #tabs button.on { color: var(--gold); border-bottom-color: var(--gold); }
  .tabbody { flex: 1; overflow-y: auto; padding: 12px 14px; display: none; }
  .tabbody.on { display: block; }
  h3 { font-size: 13px; color: var(--gold); margin: 14px 0 6px; border-bottom: 1px dashed var(--line); padding-bottom: 3px; }
  h3:first-child { margin-top: 0; }
  .chip {
    display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px;
    border: 1px solid var(--line); margin: 1px 2px 1px 0; cursor: pointer; user-select: none;
  }
  .chip.set { border-color: var(--green); color: var(--green); }
  .chip.req { border-color: var(--blue); color: var(--blue); }
  .chip.hl { background: #3a3850; }
  .kv { margin: 4px 0; line-height: 1.7; }
  .kv b { color: var(--dim); font-weight: normal; font-size: 12px; margin-right: 6px; }
  .story-text {
    background: var(--panel2); border: 1px solid var(--line); border-radius: 6px;
    padding: 8px 10px; margin: 6px 0; font-size: 12.5px; line-height: 1.8; color: #cfcabe;
    white-space: pre-wrap;
  }
  .flagrow {
    display: flex; align-items: flex-start; gap: 8px; padding: 7px 4px;
    border-bottom: 1px solid #2c2b3a; cursor: pointer;
  }
  .flagrow:hover { background: var(--panel2); }
  .flagrow input { margin-top: 3px; accent-color: var(--gold); }
  .flagname { font-family: Consolas, monospace; font-size: 12.5px; color: var(--gold); }
  .flagrow.tech .flagname { color: var(--dim); }
  .flagdesc { font-size: 12px; color: var(--dim); line-height: 1.5; }
  .flagkind { font-size: 10.5px; border: 1px solid var(--line); border-radius: 8px; padding: 0 6px; color: var(--dim); white-space: nowrap; }
  .presets { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .presets button {
    background: var(--panel2); color: var(--ink); border: 1px solid var(--line);
    border-radius: 5px; padding: 4px 10px; cursor: pointer; font-size: 12px; font-family: inherit;
  }
  .presets button:hover { border-color: var(--gold); }
  .member { border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; margin-bottom: 9px; background: var(--panel2); }
  .member .nm { color: var(--gold); font-size: 14px; }
  .member .cond { font-size: 12.5px; margin-top: 4px; line-height: 1.6; }
  .member .quote { font-size: 12px; color: var(--dim); margin-top: 4px; line-height: 1.6; }
  .legend { font-size: 12px; color: var(--dim); line-height: 2; }
  .legend svg { vertical-align: middle; margin-right: 4px; }
  .muted { color: var(--dim); font-size: 12px; line-height: 1.7; }
  /* SVGノード */
  .node rect { cursor: pointer; }
  .node text { cursor: pointer; user-select: none; }
  .node.locked { opacity: 0.38; }
  .node.selected .box { stroke: #fff; stroke-width: 2.5; }
  .node.flag-set .box { stroke: var(--green); stroke-width: 2.5; }
  .node.flag-req .box { stroke: var(--blue); stroke-width: 2.5; }
  .chapter-label { fill: var(--gold); font-size: 15px; letter-spacing: 3px; }
  .chapter-line { stroke: #35334a; stroke-width: 1; stroke-dasharray: 3 4; }
  @media (max-width: 760px) {
    #wrap { flex-direction: column; }
    #side { width: 100%; max-height: 45%; border-left: none; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <h1>グラナダ開拓記 ストーリーボード</h1>
  <span class="sub">イベント・フラグ・分岐の見取り図 / 図の箱をクリックすると詳細、フラグのチェックで進行を再現できます</span>
</header>
<div id="wrap">
  <div id="graph-pane"></div>
  <div id="side">
    <div id="tabs">
      <button data-tab="detail" class="on">詳細</button>
      <button data-tab="flags">フラグ管理</button>
      <button data-tab="members">仲間</button>
      <button data-tab="help">凡例</button>
    </div>
    <div class="tabbody on" data-tab="detail" id="detail">
      <div class="muted">左の図から見たいイベントをクリックしてください。<br><br>
      金の縦ラインがメインストーリー(全4章+終幕)、右側の枝が任意イベント・仲間の加入・サイドクエストです。</div>
    </div>
    <div class="tabbody" data-tab="flags" id="flags"></div>
    <div class="tabbody" data-tab="members" id="members"></div>
    <div class="tabbody" data-tab="help" id="help"></div>
  </div>
</div>
<script>
"use strict";

// ================================================================

const FLAGS = {

    req:["intro"], sets:["q_escort_done"],
    battle:"①ユサッカ+ゴブリン×2 → ②ユサッカ×2+ボブゴブリン",
    text:"ノロエステ商会の護衛依頼。エルデラ村への「近道」はユサッカの狩り場で、道中2連戦になる。護衛の一人が命を落とす、亜人側にも縄張りの理がある……という本作のトーンを担うサイドクエスト。",
    note:"完了で 1200G+上薬草×3、q_escort_done が立ち掲示板から消える。加入済みメンバーだけの掛け合いが挟まる。" },

  { id:"j_sandora", col:2, row:10, type:"join", title:"加入: サンドラ", place:"ヤグーの森(結界門)",
    req:["forest_clear"], sets:[],
    text:"結界門ボス撃破の直後に自動で加入するエルフの戦士。「都市には、その、居場所がない。お前たちと行く。以上」",
    note:"forest_clear と同時(event_after)。加入Lv = max(4, 主人公Lv)。" },
];

// [from, to, kind]  kind: main / branch / gate(フラグで開く関係)
const EDGES = [
  ["op","office0","main"], ["office0","cave","main"], ["cave","cave_boss","main"],
  ["cave_boss","report1","main"], ["report1","wasteland","main"], ["wasteland","wl_boss","main"],
  ["wl_boss","report2","main"], ["report2","forest","main"], ["forest","forest_boss","main"],
  ["forest_boss","report3","main"], ["report3","canyon","main"], ["canyon","canyon_boss","main"],
  ["canyon_boss","ending","main"],
  ["cave","ev_ambush","branch"], ["cave","ev_nest","branch"],
  ["report3","north","branch"], ["north","mine","branch"], ["north","spire","branch"],
  ["op","j_horuhe","branch"],
  ["cave_boss","j_shabi","gate"], ["cave_boss","j_kurarisu","gate"],
  ["op","escort","branch"],
  ["forest_boss","j_sandora","gate"],
];

const CHAPTERS = [
  { row: 0,  label: "序章　配属初日" },
  { row: 1,  label: "第1章　地下実験場の調査" },
  { row: 6,  label: "第2章　古戦場のゴブリン基地" },
  { row: 9,  label: "第3章　ヤグーの森の調査" },
  { row: 12, label: "第4章　飛竜討伐" },
];

const MEMBERS = [
  { nm:"主人公", cond:"最初から。調子に乗り始めた駆け出し冒険者", quote:"(無口な主人公。決意は行動で示す)" },
  { nm:"ジェラール (傭兵)", cond:"序章: オープニングの路地裏で自動加入", quote:"「一人じゃ死ぬぞ。しばらく組もう」" },
  { nm:"ホルヘ (魔法使い)", cond:"いつでも: 魔法屋で店番の少年と話す", quote:"「お店より、その、実戦を学べって言われてて」" },
  { nm:"シャビ (斥候)", cond:"cave_clear 後: 宿屋「根なし草」で話す", quote:"「荷物持ちでも斥候でもやるから、パーティに入れてくれない?」" },
  { nm:"クラリス (シスター)", cond:"cave_clear 後: アクオス教会で話す", quote:"「私にも手伝わせなさい。これは決定事項です」" },
  { nm:"サンドラ (エルフ戦士)", cond:"forest_clear と同時: 結界門ボス撃破後に自動加入", quote:"「都市には、その、居場所がない。お前たちと行く。以上」" },
];

// ================================================================
// 描画
// ================================================================
const COLX = [70, 480, 760];   // 列ごとのx
const NODE_W = [340, 230, 260]; // 列ごとの幅
const ROW_H = 86, NODE_H = 52, TOP = 46, CH_GAP = 40; // 章の頭は帯ぶんの余白を足す
const TYPE_COLOR = { main:"#d8b653", boss:"#d67a7a", side:"#b48ad6", join:"#7ec87e", event:"#6ea8dc", optional:"#8f8ca0" };
const TYPE_LABEL = { main:"メイン", boss:"ボス戦", side:"サイド", join:"仲間", event:"イベント戦", optional:"任意" };

const byId = {};
NODES.forEach(n => byId[n.id] = n);
const checked = new Set();  // シミュレーション用のフラグ集合
let selected = null, hlFlag = null;

function rowY(row) {
  // 章の始まる行の手前に CH_GAP の余白を積む (章ラベルが箱に重ならないように)
  const gaps = CHAPTERS.filter(ch => ch.row <= row && ch.row > 0).length;
  return TOP + row * ROW_H + gaps * CH_GAP;
}

function nodeXY(n) {
  const w = NODE_W[n.col];
  return { x: COLX[n.col], y: rowY(n.row), w, h: NODE_H,
           cx: COLX[n.col] + w / 2, cy: rowY(n.row) + NODE_H / 2 };
}

function esc(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function buildGraph() {
  const maxRow = Math.max(...NODES.map(n => n.row));
  const W = 1050, H = rowY(maxRow + 1) + 30;
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  s += `<defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6a6780"/></marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d8b653"/></marker>
  </defs>`;
  // 章の帯
  for (const ch of CHAPTERS) {
    const y = rowY(ch.row) - 26;
    s += `<line class="chapter-line" x1="8" y1="${y}" x2="${W-8}" y2="${y}"/>`;
    s += `<text class="chapter-label" x="14" y="${y-7}">${esc(ch.label)}</text>`;
  }
  // 辺
  for (const [a, b, kind] of EDGES) {
    const A = nodeXY(byId[a]), B = nodeXY(byId[b]);
    let d, marker = kind === "main" ? "url(#arrg)" : "url(#arr)";
    let stroke = kind === "main" ? "#d8b653" : (kind === "gate" ? "#6ea8dc" : "#6a6780");
    let dash = kind === "main" ? "" : ` stroke-dasharray="${kind === "gate" ? "6 4" : "3 4"}"`;
    if (byId[a].col === byId[b].col) {
      d = `M${A.cx},${A.y + A.h} L${B.cx},${B.y}`;
    } else {
      const x1 = A.x + A.w, y1 = A.cy, x2 = B.x, y2 = B.cy;
      const mx = (x1 + x2) / 2;
      d = `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`;
    }
    s += `<path d="${d}" fill="none" stroke="${stroke}" stroke-width="${kind === "main" ? 2.4 : 1.5}"${dash} marker-end="${marker}"/>`;
  }
  // ノード
  for (const n of NODES) {
    const p = nodeXY(n), c = TYPE_COLOR[n.type];
    s += `<g class="node" id="nd_${n.id}" data-id="${n.id}">`;
    s += `<rect class="box" x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="8"
           fill="#242335" stroke="${c}" stroke-width="1.6"/>`;
    s += `<rect x="${p.x}" y="${p.y}" width="6" height="${p.h}" rx="3" fill="${c}"/>`;
    s += `<text x="${p.x + 16}" y="${p.y + 21}" fill="#e8e4d8" font-size="13.5">${esc(n.title)}</text>`;
    const sub = TYPE_LABEL[n.type] + (n.sets.length ? "　◆ " + n.sets.join(", ") : "");
    s += `<text x="${p.x + 16}" y="${p.y + 40}" fill="#9a96a8" font-size="11">${esc(sub)}</text>`;
    s += `<text class="lockmark" x="${p.x + p.w - 22}" y="${p.y + 22}" font-size="13" visibility="hidden">🔒</text>`;
    s += `</g>`;
  }
  s += `</svg>`;
  document.getElementById("graph-pane").innerHTML = s;
  document.querySelectorAll(".node").forEach(g => {
    g.addEventListener("click", () => selectNode(g.dataset.id));
  });
}

function refreshGraph() {
  const anyChecked = checked.size > 0;
  for (const n of NODES) {
    const g = document.getElementById("nd_" + n.id);
    const locked = anyChecked && n.req.some(f => !checked.has(f));
    g.classList.toggle("locked", locked);
    g.querySelector(".lockmark").setAttribute("visibility", locked ? "visible" : "hidden");
    g.classList.toggle("selected", selected === n.id);
    g.classList.toggle("flag-set", hlFlag !== null && n.sets.includes(hlFlag));
    g.classList.toggle("flag-req", hlFlag !== null && !n.sets.includes(hlFlag) && n.req.includes(hlFlag));
  }
}

// ---------------- 詳細 ----------------
function selectNode(id) {
  selected = id; hlFlag = null;
  const n = byId[id];
  const el = document.getElementById("detail");
  let h = `<h3>${esc(n.title)}</h3>`;
  h += `<div class="kv"><b>種別</b>${TYPE_LABEL[n.type]}</div>`;
  h += `<div class="kv"><b>場所</b>${esc(n.place)}</div>`;
  h += `<div class="kv"><b>条件</b>` + (n.req.length
        ? n.req.map(f => `<span class="chip req" data-flag="${f}">${f}</span>`).join("")
        : "なし") + `</div>`;
  h += `<div class="kv"><b>立てるフラグ</b>` + (n.sets.length
        ? n.sets.map(f => `<span class="chip set" data-flag="${f}">◆ ${f}</span>`).join("")
        : "なし") + `</div>`;
  if (n.battle) h += `<div class="kv"><b>戦闘</b>${esc(n.battle)}</div>`;
  h += `<div class="story-text">${esc(n.text)}</div>`;
  if (n.note) h += `<div class="muted">${esc(n.note)}</div>`;
  el.innerHTML = h;
  el.querySelectorAll(".chip").forEach(c =>
    c.addEventListener("click", () => { highlightFlag(c.dataset.flag); }));
  showTab("detail");
  refreshGraph();
}

function highlightFlag(f) {
  hlFlag = (hlFlag === f) ? null : f;
  refreshGraph();
  document.querySelectorAll("#detail .chip").forEach(c =>
    c.classList.toggle("hl", c.dataset.flag === hlFlag));
}

// ---------------- フラグタブ ----------------
const PRESETS = {
  "最初から": [],
  "序盤 (洞窟制圧後)": ["intro","cave_clear"],
  "中盤 (森クリア後)": ["intro","cave_clear","q_wasteland","wasteland_clear","q_forest","forest_clear"],
  "終盤 (第4章)": ["intro","cave_clear","q_wasteland","wasteland_clear","q_forest","forest_clear","q_canyon"],
  "クリア後": ["intro","cave_clear","q_wasteland","wasteland_clear","q_forest","forest_clear","q_canyon","canyon_clear","q_escort_done"],
};

function qMainStage() {
  if (!checked.has("q_wasteland")) return 0;
  if (!checked.has("q_forest")) return 1;
  if (!checked.has("q_canyon")) return 2;
  if (!checked.has("canyon_clear")) return 3;
  return 4;
}

function buildFlags() {
  const el = document.getElementById("flags");
  let h = `<h3>進行を再現する</h3>
    <div class="muted" style="margin-bottom:6px">フラグにチェックを入れると、左の図でまだ行けないイベントが 🔒 で薄くなります。</div>
    <div class="presets">` +
    Object.keys(PRESETS).map(k => `<button data-preset="${esc(k)}">${esc(k)}</button>`).join("") +
    `</div><div id="qmain" class="kv"></div><h3>フラグ一覧</h3>`;
  for (const [f, d] of Object.entries(FLAGS)) {
    h += `<label class="flagrow${d.kind === "技術" ? " tech" : ""}">` +
      (d.nocheck ? `<span style="width:13px"></span>` : `<input type="checkbox" data-flag="${f}">`) +
      `<span style="flex:1"><span class="flagname">${f}</span> <span class="flagkind">${d.kind}</span><br>` +
      `<span class="flagdesc">${esc(d.desc)}<br>◆ 立つ場所: ${esc(d.set)}</span></span></label>`;
  }
  el.innerHTML = h;
  el.querySelectorAll("input[data-flag]").forEach(cb => {
    cb.addEventListener("change", () => {
      cb.checked ? checked.add(cb.dataset.flag) : checked.delete(cb.dataset.flag);
      updateQMain(); refreshGraph();
    });
  });
  el.querySelectorAll("button[data-preset]").forEach(b => {
    b.addEventListener("click", () => {
      checked.clear();
      PRESETS[b.dataset.preset].forEach(f => checked.add(f));
      el.querySelectorAll("input[data-flag]").forEach(cb => cb.checked = checked.has(cb.dataset.flag));
      updateQMain(); refreshGraph();
    });
  });
  updateQMain();
}

function updateQMain() {
  document.getElementById("qmain").innerHTML =
    checked.size === 0
      ? `<b>状態</b>チェックなし (全イベントを表示中)`
      : `<b>状態</b>この進行だと q_main = <span style="color:var(--gold)">${qMainStage()}</span>`;
}

// ---------------- 仲間タブ ----------------
function buildMembers() {
  document.getElementById("members").innerHTML =
    `<h3>パーティメンバー (最大6人・戦闘参加4人)</h3>` +
    MEMBERS.map(m =>
      `<div class="member"><div class="nm">${esc(m.nm)}</div>` +
      `<div class="cond">${esc(m.cond)}</div>` +
      `<div class="quote">${esc(m.quote)}</div></div>`).join("");
}

// ---------------- 凡例タブ ----------------
function buildHelp() {
  const sw = c => `<svg width="14" height="14"><rect x="1" y="1" width="12" height="12" rx="3" fill="#242335" stroke="${c}" stroke-width="2"/></svg>`;
  document.getElementById("help").innerHTML = `
    <h3>箱の色 (イベントの種別)</h3>
    <div class="legend">
      ${sw(TYPE_COLOR.main)} メインストーリー<br>
      ${sw(TYPE_COLOR.boss)} ボス戦 (勝つとフラグが立つ)<br>
      ${sw(TYPE_COLOR.event)} 一度きりのイベント戦<br>
      ${sw(TYPE_COLOR.join)} 仲間の加入<br>
      ${sw(TYPE_COLOR.side)} サイドクエスト<br>
      ${sw(TYPE_COLOR.optional)} 任意 (進行に影響なし)
    </div>
    <h3>線の意味</h3>
    <div class="legend">
      <svg width="40" height="10"><line x1="0" y1="5" x2="40" y2="5" stroke="#d8b653" stroke-width="2.4"/></svg> メインの流れ<br>
      <svg width="40" height="10"><line x1="0" y1="5" x2="40" y2="5" stroke="#6a6780" stroke-width="1.5" stroke-dasharray="3 4"/></svg> 枝分かれ (いつでも寄れる)<br>
      <svg width="40" height="10"><line x1="0" y1="5" x2="40" y2="5" stroke="#6ea8dc" stroke-width="1.5" stroke-dasharray="6 4"/></svg> フラグで解禁される関係
    </div>
    <h3>使い方</h3>
    <div class="muted">
      ・箱をクリック → 詳細タブに条件/立てるフラグ/戦闘/あらすじが出ます。<br>
      ・詳細のフラグ札をクリック → そのフラグを<span style="color:var(--green)">立てる場所(緑)</span>と<span style="color:var(--blue)">要求する場所(青)</span>が図の上で光ります。<br>
      ・フラグ管理タブでチェック → その進行状態でまだ行けないイベントが 🔒 になります。プリセットで一気に切り替えられます。
    </div>
    <h3>このデータの出どころ</h3>
    <div class="muted">
      game/ui/title.gd (序章) / town.gd (代官所・教会・宿屋) / inn.gd (宿屋内部) /
      magic_shop.gd (ホルヘ) / map.gd (イベント戦・ボス・加入) / ending.gd /
      data/db.gd (マップとフラグ定義) から手で起こしたものです。
      ストーリーを変えたら docs/story/index.html のデータ部も更新してください。
    </div>`;
}

// ---------------- タブ ----------------
function showTab(name) {
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === name));
  document.querySelectorAll(".tabbody").forEach(t => t.classList.toggle("on", t.dataset.tab === name));
}
document.querySelectorAll("#tabs button").forEach(b =>
  b.addEventListener("click", () => showTab(b.dataset.tab)));

buildGraph();
buildFlags();
buildMembers();
buildHelp();
refreshGraph();
</script>
