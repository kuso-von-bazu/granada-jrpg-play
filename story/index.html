<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>グラナダ開拓記 ストーリーボード</title>
<style>
  :root {
    --bg: #16151c; --panel: #201f2a; --panel2: #2a2938; --line: #3d3b52;
    --ink: #e8e4d8; --dim: #9a96a8;
    --gold: #d8b653; --blue: #6ea8dc; --green: #7ec87e; --purple: #b48ad6; --gray: #8f8ca0;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Yu Gothic UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-size: 14px; display: flex; flex-direction: column;
  }
  header {
    padding: 8px 14px; border-bottom: 2px solid var(--gold);
    background: linear-gradient(#26243a, #1b1a26);
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  header h1 { margin: 0 8px 0 0; font-size: 17px; color: var(--gold); letter-spacing: 2px; }
  .btn {
    background: var(--panel2); color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 12px; cursor: pointer; font-size: 13px; font-family: inherit;
  }
  .btn:hover { border-color: var(--gold); }
  .btn.on { border-color: var(--blue); color: var(--blue); background: #232b3a; }
  .btn.danger:hover { border-color: var(--red, #d67a7a); color: #d67a7a; }
  #hint { color: var(--dim); font-size: 12px; margin-left: auto; }
  #wrap { flex: 1; display: flex; min-height: 0; }
  #canvas-pane { flex: 1; overflow: auto; position: relative; background:
    radial-gradient(circle, #24222e 1px, transparent 1px); background-size: 26px 26px; }
  #side {
    width: 340px; min-width: 280px; border-left: 1px solid var(--line);
    background: var(--panel); display: flex; flex-direction: column; min-height: 0;
  }
  #tabs { display: flex; border-bottom: 1px solid var(--line); }
  #tabs button {
    flex: 1; padding: 9px 4px; background: none; border: none; color: var(--dim);
    font-size: 13px; cursor: pointer; border-bottom: 2px solid transparent; font-family: inherit;
  }
  #tabs button.on { color: var(--gold); border-bottom-color: var(--gold); }
  .tabbody { flex: 1; overflow-y: auto; padding: 12px 14px; display: none; }
  .tabbody.on { display: block; }
  h3 { font-size: 13px; color: var(--gold); margin: 14px 0 6px; border-bottom: 1px dashed var(--line); padding-bottom: 3px; }
  h3:first-child { margin-top: 0; }
  label.fld { display: block; color: var(--dim); font-size: 12px; margin: 10px 0 3px; }
  input[type=text], select, textarea {
    width: 100%; background: var(--panel2); color: var(--ink); border: 1px solid var(--line);
    border-radius: 5px; padding: 6px 8px; font-size: 13px; font-family: inherit;
  }
  textarea { resize: vertical; line-height: 1.7; }
  .muted { color: var(--dim); font-size: 12px; line-height: 1.8; }
  .legend { font-size: 12.5px; color: var(--dim); line-height: 2.1; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: baseline; }
  .row { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  /* SVG */
  .node { cursor: grab; }
  .node.dragging { cursor: grabbing; }
  .node .box { fill: #242335; }
  .node.selected .box { stroke-width: 3; filter: drop-shadow(0 0 6px rgba(255,255,255,0.35)); }
  .node.connect-from .box { stroke: #fff; stroke-dasharray: 6 4; }
  .node text { user-select: none; pointer-events: none; }
  .edge { cursor: pointer; }
  .edge:hover .line { stroke: #fff; }
  @media (max-width: 760px) {
    #wrap { flex-direction: column; }
    #side { width: 100%; max-height: 46%; border-left: none; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <h1>ストーリーボード</h1>
  <button class="btn" id="b_add">＋ ノード追加</button>
  <button class="btn" id="b_connect">→ つなぐモード</button>
  <span id="hint">箱をドラッグで移動 / クリックで右のパネルから編集</span>
</header>
<div id="wrap">
  <div id="canvas-pane"></div>
  <div id="side">
    <div id="tabs">
      <button data-tab="edit" class="on">編集</button>
      <button data-tab="data">保存・共有</button>
      <button data-tab="help">使い方</button>
    </div>
    <div class="tabbody on" data-tab="edit" id="edit"></div>
    <div class="tabbody" data-tab="data" id="data"></div>
    <div class="tabbody" data-tab="help" id="help"></div>
  </div>
</div>
<script>
"use strict";
// ================================================================
// グラナダ開拓記 ストーリーボード v2 (Issue #117)
// ルート分岐・サブクエスト中心のフローチャート + その場で編集できるエディタ。
// 編集内容はこのブラウザ(localStorage)に自動保存。共有は「保存・共有」タブから。
// ================================================================

const TYPES = {
  main:   { label: "メインルート",   color: "#d8b653" },
  branch: { label: "分岐・寄り道",   color: "#6ea8dc" },
  sub:    { label: "サブクエスト",   color: "#b48ad6" },
  join:   { label: "仲間の加入",     color: "#7ec87e" },
  memo:   { label: "メモ・構想",     color: "#8f8ca0" },
};

// 初期データ: 実装済みのストーリーの根幹 (2026-08-30時点のゲームコード準拠)
const DEFAULT_DATA = { version: 2, nodes: [
  { id:"op",      x:340, y:40,  type:"main",   title:"序章: グラナダ配属と飛竜襲撃",
    text:"開拓拠点グラナダに配属された初日、街が魔物の大群に襲われ、共に来た仲間を全員失う。路地裏で傭兵ジェラールに救われ、二人で再出発する。" },
  { id:"ch1",     x:340, y:170, type:"main",   title:"第1章: 地下実験場の調査",
    text:"代官所の依頼で、古代の機械が目覚めた洞窟を調査し中枢を制圧する。報酬400G。ここを越えるとシャビ・クラリスを勧誘できる。" },
  { id:"ch2",     x:340, y:300, type:"main",   title:"第2章: 古戦場のゴブリン基地",
    text:"ユサッカに使役されたゴブリンが西の古戦場に基地を築いている。潰して報告すると報酬800G、東の森への道が開く。" },
  { id:"ch3",     x:340, y:430, type:"main",   title:"第3章: ヤグーの森の調査",
    text:"霧の奥のエルフの都市へ続く森を調査し、結界門の番人を退ける。直後にエルフの戦士サンドラが加入。報酬1500G。" },
  { id:"ch4",     x:340, y:560, type:"main",   title:"第4章: 飛竜討伐",
    text:"初日にグラナダを襲った群れの主竜を、北東の峡谷の巣で討つ。最後のメインクエスト。" },
  { id:"end",     x:340, y:690, type:"main",   title:"エンディング: グラナダの英雄",
    text:"主竜討伐を報告するとエンディング。仲間それぞれのエピローグが流れ、クリア後も自由に探索できる。" },

  { id:"cave_ev", x:40,  y:170, type:"branch", title:"寄り道: 洞窟の機械蜘蛛イベント",
    text:"洞窟内の2箇所で一度きりのイベント戦(天井の待ち伏せ/縦坑の巣)。勝つと魔晶石が手に入る。" },
  { id:"north",   x:40,  y:560, type:"branch", title:"寄り道: 北方辺境の2ダンジョン",
    text:"第4章で開く別マップ。錆びた坑道と凍てつく尖塔はどちらも任意で、クリアしなくても話は進む。" },

  { id:"escort",  x:660, y:300, type:"sub",    title:"サブ: 商隊護衛 (ノロエステ商会)",
    text:"宿屋の掲示板からいつでも受注できる一度きりの依頼。エルデラ村への「近道」はユサッカの狩り場で、護衛の犠牲と亜人側の理を描く。報酬1200G+上薬草3。" },

  { id:"j_geraru",  x:660, y:40,  type:"join", title:"加入: ジェラール (序章・自動)",
    text:"オープニングの路地裏で自動加入。" },
  { id:"j_horuhe",  x:660, y:150, type:"join", title:"加入: ホルヘ (いつでも)",
    text:"魔法屋で店番の少年と話すと加入。" },
  { id:"j_2people", x:660, y:430, type:"join", title:"加入: シャビ / クラリス (1章クリア後)",
    text:"シャビは宿屋「根なし草」、クラリスはアクオス教会で話すと加入。どちらも第1章の洞窟制圧が条件。" },
  { id:"j_sandora", x:660, y:540, type:"join", title:"加入: サンドラ (3章クリアと同時)",
    text:"結界門のボスを倒した直後に自動加入。" },
], edges: [
  ["op","ch1"], ["ch1","ch2"], ["ch2","ch3"], ["ch3","ch4"], ["ch4","end"],
  ["ch1","cave_ev"], ["ch4","north"],
  ["op","escort"],
  ["op","j_geraru"], ["op","j_horuhe"], ["ch1","j_2people"], ["ch3","j_sandora"],
]};

const LS_KEY = "granada_storyboard_v2";
const NODE_W = 260, NODE_H = 58, GRID = 10;

let data = loadData();
let selected = null;       // 選択中ノードid
let connectMode = false;
let connectFrom = null;    // つなぐモードで最初に選んだノードid
let drag = null;           // {id, dx, dy, moved}

function loadData() {
  try {
    const s = localStorage.getItem(LS_KEY);
    if (s) {
      const d = JSON.parse(s);
      if (d && Array.isArray(d.nodes) && Array.isArray(d.edges)) return d;
    }
  } catch (e) { /* localStorageが使えない環境でも初期データで動く */ }
  return JSON.parse(JSON.stringify(DEFAULT_DATA));
}

function saveData() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(data)); } catch (e) { /* 保存できなくても動作は続ける */ }
}

function nodeById(id) { return data.nodes.find(n => n.id === id); }
function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

// タイトルを箱の幅に収まる長さに刻む (2行まで)
function titleLines(t) {
  const per = 18;
  if (t.length <= per) return [t];
  return [t.slice(0, per), t.slice(per, per * 2 - 1) + (t.length > per * 2 - 1 ? "…" : "")];
}

// ---------------- 描画 ----------------
function render() {
  const pane = document.getElementById("canvas-pane");
  const sx = pane.scrollLeft, sy = pane.scrollTop;
  let maxX = 1000, maxY = 800;
  for (const n of data.nodes) { maxX = Math.max(maxX, n.x + NODE_W + 120); maxY = Math.max(maxY, n.y + NODE_H + 120); }

  let s = `<svg id="cv" width="${maxX}" height="${maxY}" xmlns="http://www.w3.org/2000/svg">`;
  s += `<defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
        <path d="M0,0 L9,4.5 L0,9 z" fill="#7a7790"/></marker></defs>`;

  // 辺: 箱の中心同士を結び、到着側は箱の縁で止める
  data.edges.forEach((e, i) => {
    const a = nodeById(e[0]), b = nodeById(e[1]);
    if (!a || !b) return;
    const ax = a.x + NODE_W / 2, ay = a.y + NODE_H / 2;
    const bx = b.x + NODE_W / 2, by = b.y + NODE_H / 2;
    const dx = bx - ax, dy = by - ay;
    const len = Math.hypot(dx, dy) || 1;
    const ux = dx / len, uy = dy / len;
    // 到着点 = 到着側の箱の縁 (矢印の先が箱に刺さって見える位置)。
    // 中心から縁までの距離は、進入方向と矩形の交点で求める。
    const back = Math.min(
      ux !== 0 ? (NODE_W / 2 + 6) / Math.abs(ux) : Infinity,
      uy !== 0 ? (NODE_H / 2 + 6) / Math.abs(uy) : Infinity);
    const ex = bx - ux * back, ey = by - uy * back;
    const mx = (ax + ex) / 2;
    const d = Math.abs(dx) > Math.abs(dy)
      ? `M${ax},${ay} C${mx},${ay} ${mx},${ey} ${ex},${ey}`
      : `M${ax},${ay} L${ex},${ey}`;
    s += `<g class="edge" data-i="${i}">
      <path d="${d}" fill="none" stroke="transparent" stroke-width="14"/>
      <path class="line" d="${d}" fill="none" stroke="#7a7790" stroke-width="2" marker-end="url(#arr)"/>
    </g>`;
  });

  // ノード
  for (const n of data.nodes) {
    const tp = TYPES[n.type] || TYPES.memo;
    const cls = ["node"];
    if (n.id === selected) cls.push("selected");
    if (n.id === connectFrom) cls.push("connect-from");
    s += `<g class="${cls.join(" ")}" data-id="${n.id}">`;
    s += `<rect class="box" x="${n.x}" y="${n.y}" width="${NODE_W}" height="${NODE_H}" rx="9" stroke="${tp.color}" stroke-width="1.8"/>`;
    s += `<rect x="${n.x}" y="${n.y}" width="6" height="${NODE_H}" rx="3" fill="${tp.color}" pointer-events="none"/>`;
    const lines = titleLines(n.title);
    if (lines.length === 1) {
      s += `<text x="${n.x + 16}" y="${n.y + 25}" fill="#e8e4d8" font-size="13.5">${esc(lines[0])}</text>`;
    } else {
      s += `<text x="${n.x + 16}" y="${n.y + 20}" fill="#e8e4d8" font-size="13">${esc(lines[0])}</text>`;
      s += `<text x="${n.x + 16}" y="${n.y + 37}" fill="#e8e4d8" font-size="13">${esc(lines[1])}</text>`;
    }
    s += `<text x="${n.x + 16}" y="${n.y + NODE_H - 8}" fill="#9a96a8" font-size="10.5">${tp.label}</text>`;
    s += `</g>`;
  }
  s += `</svg>`;
  pane.innerHTML = s;
  pane.scrollLeft = sx; pane.scrollTop = sy;

  // ノードのイベント
  pane.querySelectorAll(".node").forEach(g => {
    g.addEventListener("pointerdown", ev => startDrag(ev, g.dataset.id));
  });
  // 辺のクリック = つなぐモードなら削除
  pane.querySelectorAll(".edge").forEach(g => {
    g.addEventListener("click", () => {
      if (!connectMode) return;
      data.edges.splice(Number(g.dataset.i), 1);
      saveData(); render();
    });
  });
}

// ---------------- ドラッグと選択 ----------------
function startDrag(ev, id) {
  ev.preventDefault();
  const n = nodeById(id);
  drag = { id, dx: ev.clientX - n.x, dy: ev.clientY - n.y, moved: false };
  window.addEventListener("pointermove", onDrag);
  window.addEventListener("pointerup", endDrag, { once: true });
}

function onDrag(ev) {
  if (!drag) return;
  const n = nodeById(drag.id);
  const nx = Math.round((ev.clientX - drag.dx) / GRID) * GRID;
  const ny = Math.round((ev.clientY - drag.dy) / GRID) * GRID;
  if (nx !== n.x || ny !== n.y) {
    n.x = Math.max(0, nx); n.y = Math.max(0, ny);
    drag.moved = true;
    render();
  }
}

function endDrag() {
  window.removeEventListener("pointermove", onDrag);
  if (!drag) return;
  const wasClick = !drag.moved;
  const id = drag.id;
  if (drag.moved) saveData();
  drag = null;
  if (!wasClick) return;
  // クリック扱い
  if (connectMode) {
    if (connectFrom === null) {
      connectFrom = id;
    } else if (connectFrom !== id) {
      // 既にあれば削除、なければ追加 (向きも見る)
      const i = data.edges.findIndex(e => (e[0] === connectFrom && e[1] === id) || (e[0] === id && e[1] === connectFrom));
      if (i >= 0) data.edges.splice(i, 1);
      else data.edges.push([connectFrom, id]);
      connectFrom = null;
      saveData();
    } else {
      connectFrom = null;
    }
  } else {
    selected = id;
    buildEditPanel();
    showTab("edit");
  }
  render();
}

// ---------------- 編集パネル ----------------
function buildEditPanel() {
  const el = document.getElementById("edit");
  const n = selected ? nodeById(selected) : null;
  if (!n) {
    el.innerHTML = `<div class="muted">箱をクリックすると、ここで内容を編集できます。<br><br>
      「＋ ノード追加」で新しい箱、「→ つなぐモード」で箱と箱を矢印で結べます。<br><br>
      変更はこのブラウザに自動保存されます。</div>`;
    return;
  }
  const opts = Object.entries(TYPES).map(([k, v]) =>
    `<option value="${k}"${n.type === k ? " selected" : ""}>${v.label}</option>`).join("");
  el.innerHTML = `
    <h3>ノードを編集</h3>
    <label class="fld">タイトル</label>
    <input type="text" id="f_title" value="${esc(n.title)}" maxlength="60">
    <label class="fld">種別 (枠の色)</label>
    <select id="f_type">${opts}</select>
    <label class="fld">説明・メモ</label>
    <textarea id="f_text" rows="9">${esc(n.text || "")}</textarea>
    <div class="row">
      <button class="btn danger" id="f_del">このノードを削除</button>
    </div>
    <div class="muted" style="margin-top:10px">入力はそのまま自動保存されます。矢印の付け外しは上の「→ つなぐモード」で。</div>`;
  document.getElementById("f_title").addEventListener("input", ev => { n.title = ev.target.value; saveData(); render(); });
  document.getElementById("f_type").addEventListener("change", ev => { n.type = ev.target.value; saveData(); render(); });
  document.getElementById("f_text").addEventListener("input", ev => { n.text = ev.target.value; saveData(); });
  document.getElementById("f_del").addEventListener("click", () => {
    if (!confirm(`「${n.title}」を削除しますか? (つながっている矢印も消えます)`)) return;
    data.nodes = data.nodes.filter(x => x.id !== n.id);
    data.edges = data.edges.filter(e => e[0] !== n.id && e[1] !== n.id);
    selected = null;
    saveData(); buildEditPanel(); render();
  });
}

// ---------------- ノード追加・つなぐモード ----------------
document.getElementById("b_add").addEventListener("click", () => {
  const pane = document.getElementById("canvas-pane");
  const id = "n" + Date.now().toString(36);
  data.nodes.push({
    id,
    x: Math.round((pane.scrollLeft + 60) / GRID) * GRID,
    y: Math.round((pane.scrollTop + 60) / GRID) * GRID,
    type: "memo", title: "新しいノード", text: "",
  });
  selected = id;
  saveData(); buildEditPanel(); showTab("edit"); render();
});

document.getElementById("b_connect").addEventListener("click", () => {
  connectMode = !connectMode;
  connectFrom = null;
  const b = document.getElementById("b_connect");
  b.classList.toggle("on", connectMode);
  document.getElementById("hint").textContent = connectMode
    ? "つなぐモード: 元の箱→先の箱の順にクリックで矢印を追加 (もう一度同じ2つで削除 / 矢印をクリックでも削除)"
    : "箱をドラッグで移動 / クリックで右のパネルから編集";
  render();
});

// ---------------- 保存・共有タブ ----------------
function buildDataPanel() {
  const el = document.getElementById("data");
  el.innerHTML = `
    <h3>保存について</h3>
    <div class="muted">編集はこのブラウザに自動保存されます (このPCのこのブラウザ限定)。
    別の環境と共有したいときや、ゲーム側に取り込んでほしいときは、下の書き出しを使ってください。</div>
    <h3>書き出し / 取り込み</h3>
    <div class="row">
      <button class="btn" id="d_export">書き出す</button>
      <button class="btn" id="d_copy">コピー</button>
      <button class="btn" id="d_import">取り込む</button>
    </div>
    <textarea id="d_text" rows="10" placeholder="「書き出す」でここに現在の盤面データ(JSON)が出ます。&#10;取り込むときは、ここにデータを貼って「取り込む」。" style="margin-top:8px"></textarea>
    <div id="d_msg" class="muted" style="margin-top:6px"></div>
    <h3>初期化</h3>
    <div class="row"><button class="btn danger" id="d_reset">初期データ(実装済みストーリー)に戻す</button></div>
    <h3>ゲームへの反映</h3>
    <div class="muted">ここで描いた構想をゲームに実装してほしいときは、「書き出す」→「コピー」した内容を
    GitHubのIssue(改善要望)に貼ってください。それを見て実装します。</div>`;
  const ta = () => document.getElementById("d_text");
  const msg = t => { document.getElementById("d_msg").textContent = t; };
  document.getElementById("d_export").addEventListener("click", () => {
    ta().value = JSON.stringify(data, null, 1);
    msg("書き出しました。「コピー」でクリップボードへ。");
  });
  document.getElementById("d_copy").addEventListener("click", async () => {
    if (!ta().value) ta().value = JSON.stringify(data, null, 1);
    try { await navigator.clipboard.writeText(ta().value); msg("コピーしました。"); }
    catch (e) { ta().select(); msg("自動コピーできない環境です。全選択したので Ctrl+C を押してください。"); }
  });
  document.getElementById("d_import").addEventListener("click", () => {
    try {
      const d = JSON.parse(ta().value);
      if (!d || !Array.isArray(d.nodes) || !Array.isArray(d.edges)) throw new Error("形式が違います");
      data = d; selected = null; connectFrom = null;
      saveData(); buildEditPanel(); render();
      msg("取り込みました。");
    } catch (e) { msg("取り込めませんでした: " + e.message); }
  });
  document.getElementById("d_reset").addEventListener("click", () => {
    if (!confirm("いま描いてある内容を捨てて、実装済みストーリーの初期データに戻しますか?")) return;
    data = JSON.parse(JSON.stringify(DEFAULT_DATA));
    selected = null; connectFrom = null;
    saveData(); buildEditPanel(); render();
    msg("初期データに戻しました。");
  });
}

// ---------------- 使い方タブ ----------------
function buildHelpPanel() {
  const lg = Object.values(TYPES).map(v =>
    `<span class="dot" style="background:${v.color}"></span>${v.label}<br>`).join("");
  document.getElementById("help").innerHTML = `
    <h3>これは何?</h3>
    <div class="muted">ストーリーの根幹(ルート・分岐・サブクエスト)を1枚のフローチャートで見て、
    そのまま並べ替えたり書き足したりできるボードです。
    初期状態には、いま実装されているストーリーが入っています。</div>
    <h3>操作</h3>
    <div class="muted">
    ・箱をドラッグ = 移動<br>
    ・箱をクリック = 右のパネルで編集 (タイトル/種別/説明)<br>
    ・＋ ノード追加 = 新しい箱 (画面左上に出ます)<br>
    ・→ つなぐモード = 箱→箱の順にクリックで矢印。同じ2つをもう一度、または矢印自体をクリックで削除<br>
    ・削除 = 箱を選んで「このノードを削除」</div>
    <h3>枠の色</h3>
    <div class="legend">${lg}</div>
    <h3>保存と共有</h3>
    <div class="muted">編集は自動でこのブラウザに保存されます。
    構想をゲームに実装してほしいときは「保存・共有」タブで書き出してIssueに貼ってください。</div>`;
}

// ---------------- タブ ----------------
function showTab(name) {
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === name));
  document.querySelectorAll(".tabbody").forEach(t => t.classList.toggle("on", t.dataset.tab === name));
}
document.querySelectorAll("#tabs button").forEach(b =>
  b.addEventListener("click", () => showTab(b.dataset.tab)));

buildEditPanel();
buildDataPanel();
buildHelpPanel();
render();
</script>
